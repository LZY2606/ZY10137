spring.application.name=wildlife-identity-review
spring.datasource.url=jdbc:sqlite:${APP_DB:wildlife-review.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON
spring.datasource.hikari.maximum-pool-size=3
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.jackson.property-naming-strategy=SNAKE_CASE
app.demo-seed-enabled=${APP_DEMO_SEED:true}
server.servlet.context-path=/
