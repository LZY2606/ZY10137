spring.application.name=identity-hypotheses
server.port=8080

# SQLite database; override --idh.db.path or spring.datasource.url for tests.
idh.db.path=${user.dir}/data/wildlife.db
spring.datasource.url=jdbc:sqlite:${idh.db.path}
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite is a single writer; Hikari size 1 keeps writes serialized without busy errors.
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.pool-name=sqlite-pool

# Jackson: emit ISO-8601 instants with offset where relevant.
spring.jackson.write-dates-as-timestamps=false
spring.mvc.throw-exception-if-no-handler-found=true

logging.level.com.ecology.idhyp=INFO
